" fill="#fff" font-weight="bold" text-anchor="middle">VN</text><rect x="296" y="310" width="61" height="43" rx="5" fill="#64748b" stroke="#64748b"/><text x="327" y="338" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">D34</text><rect x="374" y="310" width="61" height="43" rx="5" fill="#64748b" stroke="#64748b"/><text x="405" y="338" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">D35</text><rect x="452" y="310" width="61" height="43" rx="5" fill="#64748b" stroke="#64748b"/><text x="483" y="338" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">D32</text><rect x="530" y="310" width="61" height="43" rx="5" fill="#64748b" stroke="#64748b"/><text x="561" y="338" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">D33</text><rect x="608" y="310" width="61" height="43" rx="5" fill="#64748b" stroke="#64748b"/><text x="639" y="338" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">D25</text><rect x="686" y="310" width="61" height="43" rx="5" fill="#64748b" stroke="#64748b"/><text x="717" y="338" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">D26</text><rect x="764" y="310" width="61" height="43" rx="5" fill="#7c3aed" stroke="#7c3aed"/><text x="795" y="338" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">D27</text><rect x="842" y="310" width="61" height="43" rx="5" fill="#64748b" stroke="#64748b"/><text x="873" y="338" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">D14</text><rect x="920" y="310" width="61" height="43" rx="5" fill="#64748b" stroke="#64748b"/><text x="951" y="338" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">D12</text><rect x="998" y="310" width="61" height="43" rx="5" fill="#64748b" stroke="#64748b"/><text x="1029" y="338" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">D13</text><rect x="1076" y="310" width="61" height="43" rx="5" fill="#334155" stroke="#334155"/><text x="1107" y="338" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">GND</text><rect x="1154" y="310" width="61" height="43" rx="5" fill="#dc2626" stroke="#dc2626"/><text x="1185" y="338" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">VIN</text><rect x="71" y="232" width="160" height="55" rx="4" fill="#334155" stroke="#64748b"/><text x="151" y="266" font-size="18" fill="#fff" font-weight="normal" text-anchor="middle">ANTENA</text><rect x="1185" y="232" width="140" height="55" rx="4" fill="#94a3b8" stroke="#94a3b8"/><text x="1255" y="266" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="middle">USB →</text><rect x="40" y="420" width="640" height="290" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="62" y="454" font-size="23" fill="#0f172a" font-weight="bold" text-anchor="start">TZT · adaptador de la sonda</text><rect x="60" y="473" width="39" height="24" rx="5" fill="#c026d3" stroke="#c026d3"/><text x="79" y="490" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">04</text><text x="112" y="490" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">TZT:VCC  →  G:B1</text><rect x="60" y="502" width="39" height="24" rx="5" fill="#334155" stroke="#334155"/><text x="79" y="519" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">05</text><text x="112" y="519" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">TZT:GND  →  G:B5</text><rect x="60" y="531" width="39" height="24" rx="5" fill="#ca8a04" stroke="#ca8a04"/><text x="79" y="548" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">06</text><text x="112" y="548" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">TZT:DAT  →  G:A15</text><rect x="60" y="560" width="39" height="24" rx="5" fill="#ca8a04" stroke="#ca8a04"/><text x="79" y="577" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">21</text><text x="112" y="577" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">ESP:D4  →  G:B15</text><rect x="720" y="420" width="640" height="290" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="742" y="454" font-size="23" fill="#0f172a" font-weight="bold" text-anchor="start">MPU-6050 · SY-104</text><rect x="740" y="473" width="39" height="24" rx="5" fill="#c026d3" stroke="#c026d3"/><text x="759" y="490" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">07</text><text x="792" y="490" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">MPU:VCC  →  G:C1</text><rect x="740" y="502" width="39" height="24" rx="5" fill="#334155" stroke="#334155"/><text x="759" y="519" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">08</text><text x="792" y="519" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">MPU:GND  →  G:C5</text><rect x="740" y="531" width="39" height="24" rx="5" fill="#334155" stroke="#334155"/><text x="759" y="548" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">09</text><text x="792" y="548" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">MPU:AD0  →  G:D5</text><rect x="740" y="560" width="39" height="24" rx="5" fill="#059669" stroke="#059669"/><text x="759" y="577" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">10</text><text x="792" y="577" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">MPU:SDA  →  ESP:D21</text><rect x="740" y="589" width="39" height="24" rx="5" fill="#2563eb" stroke="#2563eb"/><text x="759" y="606" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">11</text><text x="792" y="606" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">MPU:SCL  →  ESP:D22</text><rect x="40" y="740" width="640" height="290" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="62" y="774" font-size="23" fill="#0f172a" font-weight="bold" text-anchor="start">HC-SR04</text><rect x="60" y="793" width="39" height="24" rx="5" fill="#dc2626" stroke="#dc2626"/><text x="79" y="810" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">13</text><text x="112" y="810" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">HC:VCC  →  G:B10</text><rect x="60" y="822" width="39" height="24" rx="5" fill="#334155" stroke="#334155"/><text x="79" y="839" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">14</text><text x="112" y="839" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">HC:GND  →  G:B6</text><rect x="60" y="851" width="39" height="24" rx="5" fill="#ea580c" stroke="#ea580c"/><text x="79" y="868" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">15</text><text x="112" y="868" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">HC:TRIG  →  ESP:D18</text><rect x="60" y="880" width="39" height="24" rx="5" fill="#9333ea" stroke="#9333ea"/><text x="79" y="897" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">16</text><text x="112" y="897" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">HC:ECHO  →  P:A5</text><rect x="60" y="909" width="39" height="24" rx="5" fill="#0891b2" stroke="#0891b2"/><text x="79" y="926" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">18</text><text x="112" y="926" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">P:B10  →  ESP:D19</text><rect x="720" y="740" width="640" height="290" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="742" y="774" font-size="23" fill="#0f172a" font-weight="bold" text-anchor="start">Distribución y pulsador</text><rect x="740" y="793" width="39" height="24" rx="5" fill="#c026d3" stroke="#c026d3"/><text x="759" y="810" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">01</text><text x="792" y="810" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">ESP:3V3  →  G:A1</text><rect x="740" y="822" width="39" height="24" rx="5" fill="#334155" stroke="#334155"/><text x="759" y="839" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">02</text><text x="792" y="839" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">ESP:GND  →  G:A5</text><rect x="740" y="851" width="39" height="24" rx="5" fill="#dc2626" stroke="#dc2626"/><text x="759" y="868" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">03</text><text x="792" y="868" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">ESP:VIN  →  G:A10</text><rect x="740" y="880" width="39" height="24" rx="5" fill="#334155" stroke="#334155"/><text x="759" y="897" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">12</text><text x="792" y="897" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">G:E5  →  G:A6</text><rect x="740" y="909" width="39" height="24" rx="5" fill="#334155" stroke="#334155"/><text x="759" y="926" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">17</text><text x="792" y="926" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">G:C6  →  P:A2</text><rect x="740" y="938" width="39" height="24" rx="5" fill="#334155" stroke="#334155"/><text x="759" y="955" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">19</text><text x="792" y="955" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">P:C2  →  P:J20</text><rect x="740" y="967" width="39" height="24" rx="5" fill="#7c3aed" stroke="#7c3aed"/><text x="759" y="984" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">20</text><text x="792" y="984" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">P:A20  →  ESP:D27</text><rect x="40" y="1060" width="1320" height="180" rx="12" fill="#fff7ed" stroke="#fdba74"/><text x="62" y="1095" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="start">Divisor obligatorio en la protoboard pequeña</text><text x="62" y="1134" font-size="21" fill="#0f172a" font-weight="normal" text-anchor="start">R1a 2 kΩ: E5–E10 ∥ R1b 2 kΩ: C5–C10 → equivalente 1 kΩ → fila 10 → D19</text><text x="62" y="1170" font-size="21" fill="#0f172a" font-weight="normal" text-anchor="start">Nodo fila 10 — [R2 2 kΩ: D10–D2] — GND. ECHO no va directo al ESP32.</text><text x="62" y="1207" font-size="21" fill="#0f172a" font-weight="normal" text-anchor="start">R3a 2 kΩ: G:E1–G:E8 + R3b 2 kΩ: G:D8–G:E15 → serie 4 kΩ entre 3V3 y DAT.</text><text x="40" y="1290" font-size="19" fill="#0f172a" font-weight="normal" text-anchor="start">G = grande (coordenadas propias, ver su plano). P = pequeña (coordenadas impresas).</text><text x="40" y="1323" font-size="19" fill="#0f172a" font-weight="normal" text-anchor="start">Sonda confirmada: amarillo → DAT · rojo → VCC · negro → GND. Alimentación TZT: 3,3 V.</text><text x="40" y="1356" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">MPU: XDA, XCL e INT sin conectar. ESP32 y módulos se unen con Dupont; no se insertan en estas rejillas.</text></svg>