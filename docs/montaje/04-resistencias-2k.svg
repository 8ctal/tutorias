<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" font-family="Segoe UI,Arial,sans-serif"><rect width="100%" height="100%" fill="#f1f5f9"/><text x="35" y="48" font-size="30" fill="#0f172a" font-weight="bold" text-anchor="start">Solo resistencias de 2 kΩ · mismos 21 cables</text><text x="35" y="84" font-size="19" fill="#0f172a" font-weight="normal" text-anchor="start">Desconecta USB. Retira R1 y R3 originales; conserva R2. No cambies GPIO ni firmware.</text><rect x="35" y="110" width="1130" height="440" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="60" y="148" font-size="25" fill="#0f172a" font-weight="bold" text-anchor="start">P · pequeña · coordenadas impresas</text><text x="110" y="194" font-size="19" fill="#0f172a" font-weight="bold" text-anchor="middle">A</text><text x="175" y="194" font-size="19" fill="#0f172a" font-weight="bold" text-anchor="middle">B</text><text x="240" y="194" font-size="19" fill="#0f172a" font-weight="bold" text-anchor="middle">C</text><text x="305" y="194" font-size="19" fill="#0f172a" font-weight="bold" text-anchor="middle">D</text><text x="370" y="194" font-size="19" fill="#0f172a" font-weight="bold" text-anchor="middle">E</text><text x="65" y="236" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">2</text><path d="M110,230 L370,230" stroke="#cbd5e1" stroke-width="12" fill="none"/><circle cx="110" cy="230" r="6" fill="#64748b"/><circle cx="175" cy="230" r="6" fill="#64748b"/><circle cx="240" cy="230" r="6" fill="#64748b"/><circle cx="305" cy="230" r="6" fill="#64748b"/><circle cx="370" cy="230" r="6" fill="#64748b"/><text x="65" y="346" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">5</text><path d="M110,340 L370,340" stroke="#cbd5e1" stroke-width="12" fill="none"/><circle cx="110" cy="340" r="6" fill="#64748b"/><circle cx="175" cy="340" r="6" fill="#64748b"/><circle cx="240" cy="340" r="6" fill="#64748b"/><circle cx="305" cy="340" r="6" fill="#64748b"/><circle cx="370" cy="340" r="6" fill="#64748b"/><text x="65" y="476" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">10</text><path d="M110,470 L370,470" stroke="#cbd5e1" stroke-width="12" fill="none"/><circle cx="110" cy="470" r="6" fill="#64748b"/><circle cx="175" cy="470" r="6" fill="#64748b"/><circle cx="240" cy="470" r="6" fill="#64748b"/><circle cx="305" cy="470" r="6" fill="#64748b"/><circle cx="370" cy="470" r="6" fill="#64748b"/><path d="M240,340 L240,470" stroke="#92400e" stroke-width="4" fill="none"/><rect x="221" y="383.0" width="38" height="44" rx="4" fill="#fef3c7" stroke="#92400e"/><text x="240" y="410.0" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">R1b</text><path d="M370,340 L370,470" stroke="#92400e" stroke-width="4" fill="none"/><rect x="351" y="383.0" width="38" height="44" rx="4" fill="#fef3c7" stroke="#92400e"/><text x="370" y="410.0" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">R1a</text><path d="M305,230 L305,470" stroke="#92400e" stroke-width="4" fill="none"/><rect x="286" y="328.0" width="38" height="44" rx="4" fill="#fef3c7" stroke="#92400e"/><text x="305" y="355.0" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">R2</text><circle cx="110" cy="340" r="15" fill="#9333ea"/><text x="110" y="345" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">16</text><circle cx="175" cy="470" r="15" fill="#0891b2"/><text x="175" y="475" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">18</text><circle cx="110" cy="230" r="15" fill="#334155"/><text x="110" y="235" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">17</text><circle cx="240" cy="230" r="15" fill="#334155"/><text x="240" y="235" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">19</text><text x="510" y="220" font-size="22" fill="#0f172a" font-weight="normal" text-anchor="start">R1a: E5 ↔ E10 · 2 kΩ</text><text x="510" y="267" font-size="22" fill="#0f172a" font-weight="normal" text-anchor="start">R1b: C5 ↔ C10 · 2 kΩ</text><text x="510" y="314" font-size="22" fill="#0f172a" font-weight="normal" text-anchor="start">R2: D10 ↔ D2 · 2 kΩ</text><text x="510" y="361" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">R1a ∥ R1b = 1 kΩ</text><text x="510" y="408" font-size="22" fill="#0f172a" font-weight="normal" text-anchor="start">ECHO → 1 kΩ → D19 → 2 kΩ → GND</text><text x="510" y="455" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Salida ≈ 3,33 V para ECHO de 5 V</text><rect x="35" y="580" width="1130" height="365" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="60" y="620" font-size="23" fill="#0f172a" font-weight="bold" text-anchor="start">G · grande · grupos contados desde el primer agujero izquierdo</text><text x="160" y="661" font-size="19" fill="#0f172a" font-weight="bold" text-anchor="middle">G1</text><path d="M160,690 L160,830" stroke="#cbd5e1" stroke-width="12" fill="none"/><circle cx="160" cy="690" r="6" fill="#64748b"/><circle cx="160" cy="725" r="6" fill="#64748b"/><circle cx="160" cy="760" r="6" fill="#64748b"/><circle cx="160" cy="795" r="6" fill="#64748b"/><circle cx="160" cy="830" r="6" fill="#64748b"/><text x="390" y="661" font-size="19" fill="#0f172a" font-weight="bold" text-anchor="middle">G8</text><path d="M390,690 L390,830" stroke="#cbd5e1" stroke-width="12" fill="none"/><circle cx="390" cy="690" r="6" fill="#64748b"/><circle cx="390" cy="725" r="6" fill="#64748b"/><circle cx="390" cy="760" r="6" fill="#64748b"/><circle cx="390" cy="795" r="6" fill="#64748b"/><circle cx="390" cy="830" r="6" fill="#64748b"/><text x="620" y="661" font-size="19" fill="#0f172a" font-weight="bold" text-anchor="middle">G15</text><path d="M620,690 L620,830" stroke="#cbd5e1" stroke-width="12" fill="none"/><circle cx="620" cy="690" r="6" fill="#64748b"/><circle cx="620" cy="725" r="6" fill="#64748b"/><circle cx="620" cy="760" r="6" fill="#64748b"/><circle cx="620" cy="795" r="6" fill="#64748b"/><circle cx="620" cy="830" r="6" fill="#64748b"/><text x="105" y="696" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="start">A</text><text x="105" y="731" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="start">B</text><text x="105" y="766" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="start">C</text><text x="105" y="801" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="start">D</text><text x="105" y="836" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="start">E</text><path d="M160,830 L160,880" stroke="#92400e" stroke-width="3" fill="none"/><path d="M160,880 L390,880" stroke="#92400e" stroke-width="3" fill="none"/><path d="M390,880 L390,830" stroke="#92400e" stroke-width="3" fill="none"/><rect x="225" y="863" width="105" height="33" rx="5" fill="#fef3c7" stroke="#92400e"/><text x="277" y="886" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle">R3a 2 kΩ</text><path d="M390,795 L445,795" stroke="#92400e" stroke-width="3" fill="none"/><path d="M445,795 L445,880" stroke="#92400e" stroke-width="3" fill="none"/><path d="M445,880 L620,880" stroke="#92400e" stroke-width="3" fill="none"/><path d="M620,880 L620,830" stroke="#92400e" stroke-width="3" fill="none"/><rect x="475" y="863" width="115" height="33" rx="5" fill="#fef3c7" stroke="#92400e"/><text x="532" y="886" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle">R3b 2 kΩ</text><text x="715" y="698" font-size="22" fill="#0f172a" font-weight="normal" text-anchor="start">R3a: E1 ↔ E8 · 2 kΩ</text><text x="715" y="744" font-size="22" fill="#0f172a" font-weight="normal" text-anchor="start">R3b: D8 ↔ E15 · 2 kΩ</text><text x="715" y="790" font-size="20" fill="#0f172a" font-weight="normal" text-anchor="start">D8 y E8 unidos por dentro.</text><text x="715" y="836" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Serie: 2 kΩ + 2 kΩ = 4 kΩ</text><text x="55" y="998" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Total: 5 resistencias de 2 kΩ. Los cables y sus agujeros permanecen iguales.</text><text x="55" y="1035" font-size="18" fill="#0f172a" font-weight="normal" text-anchor="start">Los dibujos muestran solo los grupos usados. No unas las dos patas de una resistencia en la misma tira.</text><text x="55" y="1072" font-size="19" fill="#0f172a" font-weight="normal" text-anchor="start">El pulsador y los módulos conservan las conexiones de la guía original.</text></svg>